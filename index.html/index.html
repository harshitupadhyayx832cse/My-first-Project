<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Calculator</title>
     <link rel="stylesheet" href="style.css">
</head>
<body>
   


    
    <div id="main">
        <div id="calc">
            <div id="screen"></div>
                <div id="button">
                    <button onclick="window.location='index.html'">AC</button>
                     <button onclick="cancel()">C</button>
                    <button onclick="updator('%')">%</button>
                    <button onclick="updator('*')">*</button>
                    


                    <button onclick="updator(7)">7</button>
                    <button onclick="updator(8)">8</button>
                    <button onclick="updator(9)">9</button>
                    <button onclick="updator('/')">/</button>


                    <button onclick="updator(4)">4</button>
                    <button onclick="updator(5)">5</button>
                    <button onclick="updator(6)">6</button>
                    <button onclick="updator('+')">+</button>

                     <button onclick="updator(1)">1</button>
                    <button onclick="updator(2)">2</button>
                    <button onclick="updator(3)">3</button>
                    <button onclick="updator('-')">-</button>


                     <button onclick="updator(0)">0</button>
                    <button onclick="updator('.')">.</button>
                    <button onclick="updator('**')">**</button>
                    <button onclick="calculate('=')">=</button>
                </div>
            </div>
        </div>



    <script src="pt.js"></script>
</body>
</html>
